[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-fire-simulation"
version = "0.1.0"
description = "Exploratory 3D simulation of building fire, occupants, safety systems, and emergency response"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["fire_building_sim*"]
